# ============================================================
# ShopStack Backend — Test Configuration
#
# This file is loaded ONLY during test execution (src/test/resources).
# It overrides the main application.properties to use an in-memory
# H2 database instead of PostgreSQL, so tests never require a live DB.
# ============================================================

# ------------------------------------------------------------
# H2 In-Memory Datasource
# Spring Boot auto-detects H2 on the classpath in test scope.
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ------------------------------------------------------------
# JPA / Hibernate — H2 Dialect
# create-drop: creates schema on startup, drops it on shutdown.
# Perfect for isolated, repeatable tests.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false

# Disable HikariCP pool name to avoid conflicts with multiple contexts
spring.datasource.hikari.pool-name=ShopStack-Test-Pool
spring.datasource.hikari.maximum-pool-size=2

# ------------------------------------------------------------
# JWT Configuration (same as main — tests must sign tokens)
# ------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000

# ------------------------------------------------------------
# Razorpay Configuration (Test Mock Keys)
# ------------------------------------------------------------
razorpay.key.id=rzp_test_mockkeyid
razorpay.key.secret=mocksecret123456789


# ------------------------------------------------------------
# Suppress verbose logging during tests
# ------------------------------------------------------------
logging.level.com.shopstack=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN

# ------------------------------------------------------------
# Password Reset (test config)
# ------------------------------------------------------------
password.reset.token.expiry-minutes=30
app.frontend-url=http://localhost:5173
app.dev-mode=true
app.name=ShopStack

# Email disabled in tests — no real SMTP needed
spring.mail.host=
spring.mail.from=noreply@shopstack.com
