# ============================================================
# ShopStack Backend — Application Configuration
# All sensitive values MUST be provided via environment variables.
# See .env.example for required variable names.
# ============================================================

# ------------------------------------------------------------
# Server Configuration
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
# PostgreSQL Datasource
# Credentials must be supplied via environment variables.
# Local dev: copy .env.example to .env and set real values.
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopstack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:preethi@2006}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate Configuration
# NOTE: Use 'validate' in production; 'update' only for local dev.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------
# Connection Pool (HikariCP — Spring Boot default)
# ------------------------------------------------------------
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.pool-name=ShopStack-HikariPool

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.shopstack=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# ------------------------------------------------------------
# Application Identity
# ------------------------------------------------------------
spring.application.name=shopstack-backend

# ------------------------------------------------------------
# JWT Configuration
# JWT_SECRET must be a Base64-encoded 256-bit (32-byte) minimum key.
# Generate: openssl rand -hex 32 | base64
# ------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ------------------------------------------------------------
# CORS
# Override CORS_ALLOWED_ORIGINS in production with actual frontend URL.
# ------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ------------------------------------------------------------
# Password Reset
# ------------------------------------------------------------
password.reset.token.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.dev-mode=${APP_DEV_MODE:false}
app.name=ShopStack

# ------------------------------------------------------------
# Email (optional — password reset emails require this)
# Set MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD env vars.
# If not set, email will not be sent but reset tokens will still be created.
# For Gmail: use App Password (not account password).
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@shopstack.com}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# ------------------------------------------------------------
# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_TS35GdsaFxZz38}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:mM5puPr6wUcwo6smjre30VRh}