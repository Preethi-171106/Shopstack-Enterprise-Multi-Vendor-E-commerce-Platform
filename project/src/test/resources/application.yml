spring:
  datasource:
    url: jdbc:h2:mem:shopstack-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  h2:
    console:
      enabled: false

shopstack:
  jwt:
    secret: test-secret-key-for-jwt-signing-that-is-long-enough-for-hs256-algorithm
    expiration-ms: 86400000
