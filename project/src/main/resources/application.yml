spring:
  application:
    name: shopstack-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/shopstack
    username: shopstack
    password: shopstack
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

server:
  port: 8080

shopstack:
  jwt:
    secret: shopstack-super-secret-key-for-jwt-signing-please-change-in-production-2024
    expiration-ms: 86400000
